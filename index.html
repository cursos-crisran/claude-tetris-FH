<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="top-controls">
    <select id="skin-select" aria-label="Cambiar skin" title="Cambiar skin">
      <option value="retro">Retro</option>
      <option value="neon">Neon</option>
      <option value="pastel">Pastel</option>
      <option value="pixel">Pixel art</option>
    </select>
    <button id="theme-toggle" type="button" aria-label="Cambiar tema" title="Cambiar tema">☀️ Claro</button>
  </div>

  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>

    <div class="game-area">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="records-section" class="records-section hidden">
          <form id="name-form" class="name-form hidden" onsubmit="return false">
            <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" aria-label="Nombre del jugador" />
            <button id="save-btn" type="button">Guardar</button>
          </form>
          <span class="label">TOP 5</span>
          <ol id="over-records" class="records-list"></ol>
          <p id="over-stats" class="records-stats"></p>
          <button id="over-reset-btn" type="button" class="link-btn">Resetear records</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-menu" class="overlay hidden" role="dialog" aria-label="Menú de pausa">
      <div class="overlay-box pause-box">
        <p class="pause-title">PAUSA</p>
        <button type="button" id="resume-btn" class="menu-btn">Reanudar</button>
        <button type="button" id="pause-restart-btn" class="menu-btn">Reiniciar</button>
        <label class="start-level">
          <span>Nivel inicial</span>
          <select id="start-level"></select>
        </label>
        <small class="start-level-hint">Se aplica a la próxima partida</small>
        <button type="button" id="controls-toggle" class="menu-btn" aria-expanded="false" aria-controls="controls-list">Ver controles</button>
        <ul id="controls-list" class="hidden">
          <li><kbd>←</kbd><kbd>→</kbd> mover</li>
          <li><kbd>↑</kbd> / <kbd>X</kbd> rotar</li>
          <li><kbd>↓</kbd> bajar</li>
          <li><kbd>Space</kbd> caída</li>
          <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
        </ul>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p id="start-title">TETRIS</p>
        <span class="label">TOP 5</span>
        <ol id="start-records" class="records-list"></ol>
        <p id="start-stats" class="records-stats"></p>
        <button id="play-btn" type="button">Jugar</button>
        <button id="start-reset-btn" type="button" class="link-btn">Resetear records</button>
      </div>
    </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
